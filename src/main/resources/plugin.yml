name: SkyFoundry
version: "${version}"
main: net.skyfoundry.SkyFoundry
api-version: "1.21"

author: SkyFoundry
description: The core Skyblock platform for the SkyFoundry server.

commands:
  island:
    description: Main SkyFoundry island command.
    usage: /island
    aliases:
      - is

  skyfoundry:
    description: SkyFoundry administration command.
    usage: /skyfoundry
    aliases:
      - sf

permissions:
  skyfoundry.command.island:
    description: Allows access to the main island command.
    default: true

  skyfoundry.admin:
    description: Allows access to SkyFoundry administrative commands.
    default: op
