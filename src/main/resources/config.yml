  upgrade-insufficient-funds: "<red>You need <gold>{cost}</gold> for that upgrade.</red>"
  upgrade-payment-failed: "<red>The economy could not process that upgrade payment.</red>"
  upgrade-no-island: "<red>You are not part of an island.</red>"
  upgrade-failed: "<red>Could not save that island upgrade. Your payment was refunded.</red>"
  upgrade-size-success: "<green>Island size upgraded to <yellow>{value}x{value}</yellow> for <gold>{cost}</gold>.</green>"
  upgrade-members-success: "<green>Member limit upgraded to <yellow>{value}</yellow> for <gold>{cost}</gold>.</green>"

# ------------------------------------------------------------
# Debug
# ------------------------------------------------------------

debug:
  # Enables additional information in the server console.
  enabled: false

# Core island upgrade tiers.
# The first tier is the default value for newly created islands and should normally cost 0.
# Costs are handled through Vault. Addons can later add extra progression requirements.
island_upgrades:
  size:
    overworld:
      enabled: true
      tiers:
        - { value: 50, cost: 0 }
        - { value: 100, cost: 10000 }
