  delete-owner-only: "<red>Only the island owner can delete the island.</red>"
  island-already-deleting: "<yellow>Your island is already being deleted.</yellow>"
  island-deleting: "<gray>Deleting your island...</gray>"

  transfer-owner-only: "<red>Only the island owner can transfer ownership.</red>"
  transfer-self: "<red>You already own the island.</red>"
  transfer-not-member: "<red>That player must already be a member of your island.</red>"
  transfer-confirm: "<red>Run <gold>/island transfer confirm {player}</gold> within <yellow>{seconds}</yellow> seconds to transfer ownership.</red>"
  transfer-confirm-expired: "<red>Your ownership transfer confirmation has expired.</red>"
  transfer-confirm-mismatch: "<red>That does not match your pending ownership transfer.</red>"
