# ============================================================
# Stormbound Configuration
# ============================================================

# ------------------------------------------------------------
# World
# ------------------------------------------------------------

world:
  # Name of the SkyBlock world.
  name: "stormbound"

  # Minecraft environment used for the island world.
  # Valid values:
  # NORMAL
  # NETHER
  # THE_END
  environment: "NORMAL"

  # Whether the plugin should automatically create the
  # island world if it does not already exist.
  auto-create: true

# ------------------------------------------------------------
# Island Dimensions
# ------------------------------------------------------------

dimensions:
  nether:
    enabled: true
    world: "stormbound_nether"
    creation-y: 100
    schematic: "schematics/starter_nether.schem"
    unlock:
      required: true
      cost: 100000

  end:
    enabled: true
    world: "stormbound_end"
    creation-y: 100
    schematic: "schematics/starter_end.schem"

    # Stormbound uses its own End progression. Disable the vanilla dragon arena,
    # central exit portal, and outer-island gateway system in this world.
    vanilla-end:
      disable-dragon: true
      disable-exit-portal: true
      disable-gateways: true

    unlock:
      required: true
      cost: 500000
      requires-nether: true

# ------------------------------------------------------------
# Islands
# ------------------------------------------------------------

islands:
  spacing: 500
  size: 50
  creation-y: 100

  # Includes the owner.
  member-limit: 5

  spawn-offset:
    x: 0.5
    y: 3.0
    z: 0.5
    yaw: 0.0
    pitch: 0.0

invites:
  # Invitations survive restarts but expire after this many seconds.
  timeout-seconds: 120

transfer:
  confirmation-timeout-seconds: 30


# ------------------------------------------------------------
# Addons
# ------------------------------------------------------------

addons:
  # Whether Stormbound should scan and load addon JARs.
  enabled: true

  # Folder inside plugins/StormboundSkyblock/ used for addon JARs.
  folder: "addons"

# ------------------------------------------------------------
# Starter Schematic
# ------------------------------------------------------------

schematic:
  # Schematic located inside the plugin's data folder.
  file: "schematics/starter.schem"

  # Read and decode schematic data asynchronously.
  #
  # World block modification itself will still be scheduled
  # safely because Bukkit world access is not generally
  # thread-safe.
  async-load: true

  # Maximum number of block operations processed in one
  # server tick when a schematic is pasted.
  #
  # Higher = faster islands, but potentially heavier ticks.
  blocks-per-tick: 750

  # Whether air stored inside the schematic should overwrite
  # existing blocks.
  paste-air: false

# ------------------------------------------------------------
# Island Protection
# ------------------------------------------------------------

protection:
  enabled: true

  block-break: true
  block-place: true
  interaction: true
  entities: true
  pistons: true
  environment: true

  prevent-building-outside-islands: true

  bypass-permission: "stormbound.skyblock.admin"

# ------------------------------------------------------------
# Teleportation
# ------------------------------------------------------------

teleport:
  # Delay before /island home teleports the player.
  delay-seconds: 0

  # Cancel a delayed teleport if the player moves.
  cancel-on-move: true

# ------------------------------------------------------------
# Island Deletion
# ------------------------------------------------------------

deletion:
  require-confirmation: true
  confirmation-timeout-seconds: 30
  positions-per-tick: 25000

  # Players are sent here when an island is deleted
  # or when they leave an island.
  teleport-world: "world"

# ------------------------------------------------------------
# Storage
# ------------------------------------------------------------

storage:
  # SQLite database file stored inside plugins/StormboundSkyblock/.
  database-file: "stormbound.db"


# ------------------------------------------------------------
# Island Info
# ------------------------------------------------------------

island-info:
  title: "<gold><bold>⚙ STORMBOUND ISLAND</bold></gold>"
  owner: "<gray>Owner:</gray> <yellow>{owner}</yellow>"
  role: "<gray>Role:</gray> <yellow>{role}</yellow>"
  members: "<gray>Members:</gray> <yellow>{members}</yellow><gray>/</gray><yellow>{limit}</yellow>"
  id: "<gray>Island ID:</gray> <yellow>#{id}</yellow>"
  center: "<gray>Center:</gray> <yellow>{x}, {z}</yellow>"
  size: "<gray>Size:</gray> <yellow>{size}x{size}</yellow>"
  created: "<gray>Created:</gray> <yellow>{created}</yellow>"

