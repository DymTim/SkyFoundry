# ============================================================
# SkyFoundry Configuration
# ============================================================

# ------------------------------------------------------------
# World
# ------------------------------------------------------------

world:
  # Name of the SkyBlock world.
  name: "skyfoundry"

  # Minecraft environment used for the island world.
  # Valid values:
  # NORMAL
  # NETHER
  # THE_END
  environment: "NORMAL"

  # Whether the plugin should automatically create the
  # island world if it does not already exist.
  auto-create: true

# ------------------------------------------------------------
# Islands
# ------------------------------------------------------------

islands:
  spacing: 500
  size: 50
  creation-y: 100

  # Includes the owner.
  member-limit: 5

  spawn-offset:
    x: 0.5
    y: 3.0
    z: 0.5
    yaw: 0.0
    pitch: 0.0

invites:
  # Invitations survive restarts but expire after this many seconds.
  timeout-seconds: 120

transfer:
  confirmation-timeout-seconds: 30

# ------------------------------------------------------------
# Starter Schematic
# ------------------------------------------------------------

schematic:
  # Schematic located inside the plugin's data folder.
  file: "schematics/starter.schem"

  # Read and decode schematic data asynchronously.
  #
  # World block modification itself will still be scheduled
  # safely because Bukkit world access is not generally
  # thread-safe.
  async-load: true

  # Maximum number of block operations processed in one
  # server tick when a schematic is pasted.
  #
  # Higher = faster islands, but potentially heavier ticks.
  blocks-per-tick: 750

  # Whether air stored inside the schematic should overwrite
  # existing blocks.
  paste-air: false

# ------------------------------------------------------------
# Island Protection
# ------------------------------------------------------------

protection:
  enabled: true

  block-break: true
  block-place: true
  interaction: true
  entities: true
  pistons: true
  environment: true

  prevent-building-outside-islands: true

  bypass-permission: "skyfoundry.admin.bypass"

# ------------------------------------------------------------
# Teleportation
# ------------------------------------------------------------

teleport:
  # Delay before /island home teleports the player.
  delay-seconds: 0

  # Cancel a delayed teleport if the player moves.
  cancel-on-move: true

# ------------------------------------------------------------
# Island Deletion
# ------------------------------------------------------------

deletion:
  require-confirmation: true
  confirmation-timeout-seconds: 30
  positions-per-tick: 25000

  # Players are sent here when an island is deleted
  # or when they leave an island.
  teleport-world: "world"

# ------------------------------------------------------------
# Storage
# ------------------------------------------------------------

storage:
  # SQLite database file stored inside plugins/SkyFoundry/.
  database-file: "skyfoundry.db"

# ------------------------------------------------------------
# Messages
# ------------------------------------------------------------

