# ============================================================
# SkyFoundry Configuration
# ============================================================

# ------------------------------------------------------------
# World
# ------------------------------------------------------------

world:
  # Name of the SkyBlock world.
  name: "skyfoundry"

  # Minecraft environment used for the island world.
  # Valid values:
  # NORMAL
  # NETHER
  # THE_END
  environment: "NORMAL"

  # Whether the plugin should automatically create the
  # island world if it does not already exist.
  auto-create: true

# ------------------------------------------------------------
# Islands
# ------------------------------------------------------------

islands:
  spacing: 500
  size: 50
  creation-y: 100

  # Includes the owner.
  member-limit: 5

  spawn-offset:
    x: 0.5
    y: 3.0
    z: 0.5
    yaw: 0.0
    pitch: 0.0

invites:
  # Invitations survive restarts but expire after this many seconds.
  timeout-seconds: 120

transfer:
  confirmation-timeout-seconds: 30

# ------------------------------------------------------------
# Addons
# ------------------------------------------------------------

addons:
  # Whether SkyFoundry should scan and load addon JARs.
  enabled: true

  # Folder inside plugins/SkyFoundry/ used for addon JARs.
  folder: "addons"

# ------------------------------------------------------------
# Starter Schematic
# ------------------------------------------------------------

schematic:
  # Schematic located inside the plugin's data folder.
  file: "schematics/starter.schem"

  # Read and decode schematic data asynchronously.
  #
  # World block modification itself will still be scheduled
  # safely because Bukkit world access is not generally
  # thread-safe.
  async-load: true

  # Maximum number of block operations processed in one
  # server tick when a schematic is pasted.
  #
  # Higher = faster islands, but potentially heavier ticks.
  blocks-per-tick: 750

  # Whether air stored inside the schematic should overwrite
  # existing blocks.
  paste-air: false

# ------------------------------------------------------------
# Island Protection
# ------------------------------------------------------------

protection:
  enabled: true

  block-break: true
  block-place: true
  interaction: true
  entities: true
  pistons: true
  environment: true

  prevent-building-outside-islands: true

  bypass-permission: "skyfoundry.admin.bypass"

# ------------------------------------------------------------
# Teleportation
# ------------------------------------------------------------

teleport:
  # Delay before /island home teleports the player.
  delay-seconds: 0

  # Cancel a delayed teleport if the player moves.
  cancel-on-move: true

# ------------------------------------------------------------
# Island Deletion
# ------------------------------------------------------------

deletion:
  require-confirmation: true
  confirmation-timeout-seconds: 30
  positions-per-tick: 25000

  # Players are sent here when an island is deleted
  # or when they leave an island.
  teleport-world: "world"

# ------------------------------------------------------------
# Storage
# ------------------------------------------------------------

storage:
  # SQLite database file stored inside plugins/SkyFoundry/.
  database-file: "skyfoundry.db"

# ------------------------------------------------------------
# Island Info
# ------------------------------------------------------------

island-info:
  title: "<gold><bold>⚙ SKYFOUNDRY ISLAND</bold></gold>"
  owner: "<gray>Owner:</gray> <yellow>{owner}</yellow>"
  role: "<gray>Role:</gray> <yellow>{role}</yellow>"
  members: "<gray>Members:</gray> <yellow>{members}</yellow><gray>/</gray><yellow>{limit}</yellow>"
  id: "<gray>Island ID:</gray> <yellow>#{id}</yellow>"
  center: "<gray>Center:</gray> <yellow>{x}, {z}</yellow>"
  size: "<gray>Size:</gray> <yellow>{size}x{size}</yellow>"
  created: "<gray>Created:</gray> <yellow>{created}</yellow>"

# ------------------------------------------------------------
# Island GUI
# ------------------------------------------------------------

gui:
  main:
    title: "<gold><bold>⚙ SKYFOUNDRY ISLAND</bold></gold>"

    filler:
      material: "GRAY_STAINED_GLASS_PANE"
      name: " "

    accents:
      enabled: true
      material: "ORANGE_STAINED_GLASS_PANE"
      name: " "
      slots: [0, 4, 8, 40]

    buttons:
      home:
        slot: 12
        material: "WHITE_BED"
        name: "<yellow><bold>Island Home</bold></yellow>"
        lore:
          - "<gray>Teleport to your island home.</gray>"
          - ""
          - "<gold>Click to teleport.</gold>"

      set-home:
        slot: 14
        material: "COMPASS"
        name: "<yellow><bold>Set Home</bold></yellow>"
        lore:
          - "<gray>Set your personal island home</gray>"
          - "<gray>to your current location.</gray>"
          - ""
          - "<gold>Click to set home.</gold>"

      members:
        slot: 20
        material: "PLAYER_HEAD"
        name: "<yellow><bold>Island Members</bold></yellow>"
        lore:
          - "<gray>View and manage island members.</gray>"
          - ""
          - "<gray>Members: <yellow>{members}</yellow>/<yellow>{limit}</yellow></gray>"
          - "<gray>Your Role: <yellow>{role}</yellow></gray>"
          - ""
          - "<gold>Click to view members.</gold>"

      info:
        slot: 22
        material: "BOOK"
        name: "<yellow><bold>Island Information</bold></yellow>"
        lore:
          - "<gray>Owner: <yellow>{owner}</yellow></gray>"
          - "<gray>Island ID: <yellow>#{id}</yellow></gray>"
          - "<gray>Size: <yellow>{size}x{size}</yellow></gray>"
          - "<gray>Center: <yellow>{x}, {z}</yellow></gray>"
          - ""
          - "<gold>Click for full information.</gold>"

      invite:
        slot: 24
        material: "NAME_TAG"
        name: "<yellow><bold>Invite Player</bold></yellow>"
        lore:
          - "<gray>Invite another player to</gray>"
          - "<gray>join your island.</gray>"
          - ""
          - "<gold>Click for invite instructions.</gold>"

      invite-locked:
        slot: 24
        material: "BARRIER"
        name: "<red><bold>Invite Player</bold></red>"
        lore:
          - "<gray>Your island role cannot</gray>"
          - "<gray>invite new members.</gray>"

      upgrades:
        slot: 30
        material: "BEACON"
        name: "<yellow><bold>Island Upgrades</bold></yellow>"
        lore:
          - "<gray>Expand and improve your island.</gray>"
          - ""
          - "<dark_gray>Coming soon.</dark_gray>"

      settings:
        slot: 32
        material: "COMPARATOR"
        name: "<yellow><bold>Island Settings</bold></yellow>"
        lore:
          - "<gray>Configure island options.</gray>"
          - ""
          - "<dark_gray>Coming soon.</dark_gray>"

      danger-owner:
        slot: 36
        material: "TNT"
        name: "<red><bold>Delete Island</bold></red>"
        lore:
          - "<gray>Permanently delete this island.</gray>"
          - ""
          - "<red>This action requires confirmation.</red>"

      danger-member:
        slot: 36
        material: "OAK_DOOR"
        name: "<red><bold>Leave Island</bold></red>"
        lore:
          - "<gray>Leave your current island.</gray>"
          - ""
          - "<red>Click to leave.</red>"

      close:
        slot: 44
        material: "BARRIER"
        name: "<red><bold>Close</bold></red>"
        lore:
          - "<gray>Close this menu.</gray>"

  create:
    title: "<gold><bold>⚙ CREATE ISLAND</bold></gold>"

    filler:
      material: "GRAY_STAINED_GLASS_PANE"
      name: " "

    accents:
      enabled: true
      material: "ORANGE_STAINED_GLASS_PANE"
      name: " "
      slots: [0, 4, 8, 40]

    buttons:
      create:
        slot: 22
        material: "GRASS_BLOCK"
        name: "<gold><bold>Create Island</bold></gold>"
        lore:
          - "<gray>Create your SkyFoundry island</gray>"
          - "<gray>and begin building your factory.</gray>"
          - ""
          - "<gold>Click to create.</gold>"

      close:
        slot: 44
        material: "BARRIER"
        name: "<red><bold>Close</bold></red>"
        lore:
          - "<gray>Close this menu.</gray>"

  messages:
    members-coming-soon: "<gray>The island members menu is coming next.</gray>"
    invite-instructions: "<gray>Use <gold>/island invite <player></gold> to invite someone.</gray>"
    upgrades-coming-soon: "<gray>Island upgrades are coming soon.</gray>"
    settings-coming-soon: "<gray>Island settings are coming soon.</gray>"

