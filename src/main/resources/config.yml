  island-created: "<green>Your island has been created.</green>"

  island-already-exists: "<red>You already own an island.</red>"

  island-not-found: "<red>You do not have an island.</red>"

  island-deleted: "<green>Your island has been deleted.</green>"

  teleporting: "<gray>Teleporting to your island...</gray>"

  teleport-cancelled: "<red>Teleport cancelled because you moved.</red>"

  island-create-failed: "<red>Something went wrong while creating your island.</red>"

  island-delete-confirm: "<red>Run <gold>/island delete confirm</gold> within <yellow>{seconds}</yellow> seconds to permanently delete your island.</red>"

  island-delete-confirm-expired: "<red>Your island deletion confirmation has expired.</red>"

  island-delete-failed: "<red>Something went wrong while deleting your island.</red>"

  island-protected: "<red>You cannot do that here.</red>"

  sethome-success: "<green>Your island home has been updated.</green>"
  sethome-outside-island: "<red>You must be standing inside your island to set your home.</red>"
  sethome-failed: "<red>Could not set your island home.</red>"

  player-not-found: "<red>That player is not online.</red>"

  invite-no-permission: "<red>Your island role cannot invite players.</red>"
  invite-self: "<red>You cannot invite yourself.</red>"
  invite-target-has-island: "<red>That player is already part of an island.</red>"
  invite-sent: "<green>Island invitation sent.</green>"
  invite-received: "<yellow>{player}</yellow> invited you to their island. Run <gold>/island accept</gold> to join."
  invite-failed: "<red>That player could not be invited.</red>"
  invite-none: "<red>You do not have a valid island invitation.</red>"
